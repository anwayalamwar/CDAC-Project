version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: todo_mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mytododb
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: password

    volumes:
      - ./database:/docker-entrypoint-initdb.d

    ports:
      - "3307:3306"

  web:
    build: .

    container_name: todo_web

    ports:
      - "8081:80"

    environment:
      DB_HOST: mysql
      DB_USER: todo_user
      DB_PASS: password
      DB_NAME: mytododb

    depends_on:
      - mysql
